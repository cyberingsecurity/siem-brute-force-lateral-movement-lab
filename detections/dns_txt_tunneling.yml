title: DNS TXT Queries to Synthetic Exfiltration Tunnel
id: 3e420e25-78b0-4d6f-9cc5-318a9a612d08
status: test
description: Matches DNS TXT queries to the synthetic data exfiltration suffix used by the lab playbook. Add a backend-specific event-count correlation and validate query entropy and destination context before production use.
references:
    - https://attack.mitre.org/techniques/T1048/003/
    - https://sigmahq.io/sigma-specification/specification/sigma-rules-specification.html
author: cyberingsecurity
date: 2026-09-29
logsource:
    product: local_siem_lab
    service: dns
    definition: Lab-normalized DNS records with source_type, event_type, query_type, query, source_ip, and hostname fields.
detection:
    selection:
        source_type: dns
        event_type: dns_query
        query_type: TXT
        query|endswith: .data.exfil-tunnel.tk
    condition: selection
fields:
    - timestamp
    - hostname
    - source_ip
    - dest_ip
    - query
    - query_type
falsepositives:
    - Authorized TXT-based transfer or an approved test using the synthetic lab suffix.
level: high
tags:
    - attack.exfiltration
    - attack.t1048.003
